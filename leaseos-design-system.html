<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaseOS — Industrial Precision design system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN TOKENS — the single source of truth.
   Every component below reads from these. Nothing hard-codes a colour.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Light / Professional — office, dispatch, client */
  --bg:#F6F8FA; --surface:#FFFFFF; --surface-2:#F0F3F6;
  --text:#17212B; --text-2:#667481; --border:#D9E0E7;

  /* Brand */
  --navy:#17324D; --action:#2F6FEB;

  /* Operational states — the only semantic colours in the system */
  --ready:#2F8F6B; --review:#D99026; --blocked:#C94E42;
  --unknown:#718096; --info:#3976B8;

  /* Tinted state fills, derived so they track the mode */
  --ready-bg:#2F8F6B14; --review-bg:#D9902614; --blocked-bg:#C94E4214;
  --unknown-bg:#71809614; --action-bg:#2F6FEB12;

  /* Spacing — 4/8/12/16/24/32/48 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;

  /* Radii */
  --r-card:9px; --r-btn:7px; --r-input:7px; --r-pill:999px;

  /* Elevation — borders and spacing do the work, shadows stay near-invisible */
  --shadow:0 1px 2px rgba(23,33,43,.04);
  --shadow-lift:0 4px 16px rgba(23,33,43,.08);

  --nav-w:248px; --bar-h:64px;
  --font:'Manrope',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#0D151D; --surface:#151F29; --surface-2:#1C2834;
  --text:#EDF2F6; --text-2:#96A6B5; --border:#2A3947;
  --navy:#DCE6F0; --action:#5B92F5;
  --ready:#4FB286; --review:#E5A648; --blocked:#E0685B;
  --unknown:#8C9BAA; --info:#5B9BD5;
  --ready-bg:#4FB2861F; --review-bg:#E5A6481F; --blocked-bg:#E0685B1F;
  --unknown-bg:#8C9BAA1F; --action-bg:#5B92F51A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lift:0 4px 20px rgba(0,0,0,.4);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .18s ease,color .18s ease;
}
.mono{font-family:var(--mono);font-size:.88em;letter-spacing:-.01em}

/* ── typographic scale ──────────────────────────────────────── */
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h2{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
h3{font-size:15px;font-weight:600;letter-spacing:-.005em}
.lede{font-size:16px;color:var(--text-2);max-width:66ch}
.small{font-size:13px;color:var(--text-2)}
.tiny{font-size:12px;color:var(--text-2)}

/* ═══ COMPONENT: AppShell ═══ */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
.shell.wide{grid-template-columns:1fr}
@media(max-width:900px){.shell{grid-template-columns:1fr}}

.cmdbar{
  grid-column:1/-1;height:var(--bar-h);display:flex;align-items:center;gap:var(--s4);
  padding:0 var(--s6);background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:60;
}
.logo{font-weight:700;font-size:17px;letter-spacing:-.03em;color:var(--text);white-space:nowrap}
.logo em{font-style:normal;color:var(--text-2);font-weight:500}

/* ═══ COMPONENT: GlobalSearch ═══ */
.search{
  flex:1;max-width:520px;display:flex;align-items:center;gap:var(--s2);
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-input);padding:0 var(--s3);height:38px;color:var(--text-2);font-size:14px;
}
.search input{
  flex:1;background:none;border:0;outline:none;font-family:inherit;font-size:14px;color:var(--text);
}
.search input::placeholder{color:var(--text-2)}
.search:focus-within{border-color:var(--action);box-shadow:0 0 0 3px var(--action-bg)}
@media(max-width:720px){.search{display:none}}

.bar-right{margin-left:auto;display:flex;align-items:center;gap:var(--s3)}

/* ═══ COMPONENT: Navigation ═══ */
nav.side{
  background:var(--surface);border-right:1px solid var(--border);
  padding:var(--s4) 0;overflow-y:auto;
}
nav.side a{
  display:flex;align-items:center;gap:var(--s3);margin:1px var(--s3);
  padding:9px var(--s3);border-radius:var(--r-btn);
  color:var(--text-2);text-decoration:none;font-size:14.5px;font-weight:500;cursor:pointer;
}
nav.side a:hover{background:var(--surface-2);color:var(--text)}
nav.side a.on{background:var(--action-bg);color:var(--action);font-weight:600}
nav.side a:focus-visible{outline:2px solid var(--action);outline-offset:1px}
nav.side .count{
  margin-left:auto;font-size:12px;font-weight:600;
  background:var(--review-bg);color:var(--review);padding:1px 7px;border-radius:var(--r-pill);
}
nav.side .divider{height:1px;background:var(--border);margin:var(--s3) var(--s4)}
@media(max-width:900px){nav.side{display:none}}

main{padding:var(--s6);max-width:1560px;width:100%}
@media(max-width:640px){main{padding:var(--s4)}}

/* ═══ COMPONENT: PageHeader ═══ */
.pagehead{margin-bottom:var(--s6);display:flex;justify-content:space-between;
  align-items:flex-start;gap:var(--s4);flex-wrap:wrap}
.pagehead .who{color:var(--text-2);font-size:14px;margin-top:2px}

/* ═══ COMPONENT: StatusBadge ═══
   Icon + word, always. Colour never carries meaning alone. ═══ */
.st{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;padding:3px 10px;border-radius:var(--r-pill);
  white-space:nowrap;line-height:1.4;
}
.st i{font-style:normal;font-size:12px;line-height:1}
.st.ready{background:var(--ready-bg);color:var(--ready)}
.st.review{background:var(--review-bg);color:var(--review)}
.st.blocked{background:var(--blocked-bg);color:var(--blocked)}
.st.unknown{background:var(--unknown-bg);color:var(--unknown)}
.st.pending{background:var(--unknown-bg);color:var(--text-2)}
.st.syncing{background:var(--action-bg);color:var(--action)}
.st.lg{font-size:14.5px;padding:5px 13px}

/* ═══ COMPONENT: Card ═══ */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow)}
.card + .card{margin-top:var(--s3)}
.card h3{margin-bottom:var(--s3)}
.card.quiet{background:transparent;border-style:dashed;box-shadow:none}

.grid{display:grid;gap:var(--s3)}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* ═══ COMPONENT: MetricCard — restrained, not a colour block ═══ */
.metric{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);padding:var(--s3) var(--s4);cursor:pointer}
.metric:hover{border-color:var(--action)}
.metric .n{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.metric .l{font-size:13px;color:var(--text-2);margin-top:2px}
.metric.alert .n{color:var(--review)}
.metric.critical .n{color:var(--blocked)}

/* ═══ COMPONENT: Button ═══ */
.btn{
  font-family:inherit;font-size:14.5px;font-weight:600;
  background:var(--surface);color:var(--text);border:1px solid var(--border);
  padding:9px 15px;border-radius:var(--r-btn);cursor:pointer;
  display:inline-flex;align-items:center;gap:var(--s2);text-decoration:none;
}
.btn:hover{border-color:var(--text-2)}
.btn:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--action)}
.btnrow{display:flex;gap:var(--s2);flex-wrap:wrap}

/* ═══ COMPONENT: ExceptionBanner ═══ */
.banner{
  display:flex;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-card);
  border:1px solid;align-items:flex-start;
}
.banner.review{background:var(--review-bg);border-color:#D9902640;color:var(--text)}
.banner.blocked{background:var(--blocked-bg);border-color:#C94E4240;color:var(--text)}
.banner.info{background:var(--action-bg);border-color:#2F6FEB30;color:var(--text)}
.banner b{display:block;font-size:14.5px;margin-bottom:2px}
.banner p{font-size:13.5px;color:var(--text-2)}

/* ═══ COMPONENT: Timeline / Stepper ═══ */
.steps{list-style:none}
.steps li{display:flex;gap:var(--s3);padding:7px 0;align-items:baseline;font-size:14.5px}
.steps .dot{width:16px;flex:0 0 16px;text-align:center;font-size:12px}
.steps .done{color:var(--text-2)}
.steps .done .dot{color:var(--ready)}
.steps .now{font-weight:600}
.steps .now .dot{color:var(--action)}
.steps .todo{color:var(--text-2);opacity:.65}
.steps time{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--text-2)}

/* ═══ COMPONENT: EvidenceDrawer — progressive disclosure ═══ */
details.evidence{border-top:1px solid var(--border);margin-top:var(--s3);padding-top:var(--s3)}
details.evidence summary{
  cursor:pointer;font-size:13.5px;color:var(--action);font-weight:600;list-style:none;
}
details.evidence summary::-webkit-details-marker{display:none}
details.evidence summary::before{content:"▸ ";font-size:11px}
details.evidence[open] summary::before{content:"▾ "}
details.evidence .body{margin-top:var(--s3);font-size:13.5px}
dl.kv{display:grid;grid-template-columns:minmax(130px,32%) 1fr;gap:var(--s2) var(--s4)}
dl.kv dt{color:var(--text-2);font-size:13px}
dl.kv dd{font-size:13.5px}

/* ═══ COMPONENT: DataTable ═══ */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--text-2);
  padding:0 var(--s3) var(--s2) 0;border-bottom:1px solid var(--border)}
td{padding:11px var(--s3) 11px 0;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.wrap{overflow-x:auto}

/* ═══ COMPONENT: DocumentRow ═══ */
.docrow{display:flex;align-items:center;gap:var(--s3);padding:10px 0;
  border-bottom:1px solid var(--border);font-size:14.5px}
.docrow:last-child{border-bottom:0}
.docrow .name{flex:1}

/* ═══ FIELD MODE — driver, large targets ═══ */
.field{max-width:460px;margin:0 auto;padding:var(--s4) var(--s4) 96px}
.field .jobcard{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);padding:var(--s4);margin-bottom:var(--s3)}
.next{
  width:100%;min-height:60px;font-family:inherit;font-size:18px;font-weight:700;
  letter-spacing:-.01em;background:var(--action);color:#fff;border:0;
  border-radius:var(--r-btn);cursor:pointer;padding:var(--s4);
}
.next:focus-visible{outline:3px solid var(--action);outline-offset:3px}
.next .hint{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:3px}
.secondaries{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s2)}
.secondaries .btn{justify-content:center;min-height:46px;font-size:14px}
.tabbar{
  position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--surface);
  border-top:1px solid var(--border);display:flex;z-index:70;
}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--text-2);text-decoration:none;font-size:11.5px;font-weight:600;cursor:pointer}
.tabbar a.on{color:var(--action)}
.tabbar .ico{font-size:17px}
.mic{
  position:fixed;right:18px;bottom:78px;z-index:71;width:56px;height:56px;border-radius:50%;
  background:var(--navy);color:var(--surface);border:0;cursor:pointer;font-size:21px;
  box-shadow:var(--shadow-lift);
}
[data-theme="dark"] .mic{background:var(--action);color:#fff}

/* ═══ COMMAND CENTRE — three columns ═══ */
.centre{display:grid;grid-template-columns:340px 1fr 300px;gap:var(--s4);align-items:start}
@media(max-width:1280px){.centre{grid-template-columns:320px 1fr}}
@media(max-width:940px){.centre{grid-template-columns:1fr}}
.col h3{margin-bottom:var(--s3);display:flex;align-items:center;gap:var(--s2)}
.actioncard{background:var(--surface);border:1px solid var(--border);border-left-width:3px;
  border-radius:var(--r-card);padding:var(--s3) var(--s4);margin-bottom:var(--s2);cursor:pointer}
.actioncard:hover{box-shadow:var(--shadow-lift)}
.actioncard.blocked{border-left-color:var(--blocked)}
.actioncard.review{border-left-color:var(--review)}
.actioncard.unknown{border-left-color:var(--unknown)}
.actioncard .top{display:flex;justify-content:space-between;gap:var(--s2);align-items:baseline}
.actioncard .id{font-family:var(--mono);font-size:13px;font-weight:500}
.actioncard .why{font-size:13.5px;color:var(--text-2);margin:3px 0 var(--s2)}

.sched{list-style:none}
.sched li{display:grid;grid-template-columns:58px 1fr auto;gap:var(--s3);
  padding:var(--s3) 0;border-bottom:1px solid var(--border);align-items:center}
.sched li:last-child{border-bottom:0}
.sched .t{font-family:var(--mono);font-size:13.5px;color:var(--text-2)}
.sched .who{font-size:13.5px;color:var(--text-2)}

/* ═══ JOB WORKSPACE tabs ═══ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:var(--s4);
  overflow-x:auto}
.tabs a{padding:10px var(--s3);font-size:14.5px;font-weight:600;color:var(--text-2);
  text-decoration:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--action);border-bottom-color:var(--action)}
.tabs a:hover{color:var(--text)}

/* ═══ CLIENT PORTAL — most generous spacing in the system ═══ */
.portal{max-width:900px;margin:0 auto;padding:var(--s12) var(--s6) var(--s12)}
.portal h1{font-size:30px;margin-bottom:var(--s2)}
.portal .jobrow{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-card);padding:var(--s6);margin-bottom:var(--s3)}
.proof{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s6);margin:var(--s4) 0}
.proof span{font-size:14px;display:flex;align-items:center;gap:6px;color:var(--text-2)}
.proof i{font-style:normal;color:var(--ready)}
.amount{font-size:34px;font-weight:700;letter-spacing:-.03em;font-family:var(--mono)}

/* ═══ token reference page ═══ */
.swatch{border:1px solid var(--border);border-radius:var(--r-btn);overflow:hidden}
.swatch .chip{height:56px}
.swatch .meta{padding:var(--s2) var(--s3);font-size:12.5px;background:var(--surface)}
.swatch .meta b{display:block;font-size:13px;font-weight:600}
.spec{display:flex;gap:var(--s4);align-items:baseline;padding:var(--s3) 0;
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.spec .label{width:150px;flex:0 0 150px;font-size:12.5px;color:var(--text-2)}

/* ═══ AGENT WORKSPACE — the assistant as a working surface, not a chat ═══ */
.agent{display:grid;grid-template-columns:1fr 380px;gap:var(--s4);align-items:start}
@media(max-width:1100px){.agent{grid-template-columns:1fr}}

.task{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
  overflow:hidden}
.task .head{padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.task .head .ctx{font-family:var(--mono);font-size:12.5px;color:var(--text-2)}

/* the plan: what the assistant is doing, visible while it does it */
.plan{list-style:none;padding:var(--s3) var(--s4)}
.plan li{display:flex;gap:var(--s3);align-items:flex-start;padding:6px 0;font-size:14px}
.plan .m{width:16px;flex:0 0 16px;text-align:center;font-size:12px;line-height:1.5}
.plan .done .m{color:var(--ready)}
.plan .done{color:var(--text-2)}
.plan .active{font-weight:600}
.plan .active .m{color:var(--action)}
.plan .queued{color:var(--text-2);opacity:.6}
.plan .detail{display:block;font-weight:400;font-size:13px;color:var(--text-2);margin-top:1px}

/* said: what the driver actually said, kept verbatim */
.utterance{background:var(--surface-2);border-left:3px solid var(--border);
  padding:var(--s3) var(--s4);margin:0 var(--s4) var(--s3);border-radius:0 var(--r-btn) var(--r-btn) 0;
  font-size:15px;line-height:1.55}
.utterance .src{font-size:12px;color:var(--text-2);margin-bottom:4px}

/* the artifact: a typed proposal, inspectable field by field */
.artifact{border:1px solid var(--border);border-radius:var(--r-card);margin:0 var(--s4) var(--s4)}
.artifact .cap{padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.artifact .cap b{font-size:14.5px}
.artifact .cap .to{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.slot{display:grid;grid-template-columns:150px 1fr auto;gap:var(--s3);align-items:center;
  padding:10px var(--s4);border-bottom:1px solid var(--border);font-size:14px}
.slot:last-of-type{border-bottom:0}
.slot .k{color:var(--text-2);font-size:13px}
.slot .v{font-weight:600}
.slot .v .approx{font-weight:400;color:var(--review);font-size:12.5px;margin-left:6px}
.slot .said{display:block;font-weight:400;font-size:12px;color:var(--text-2);margin-top:1px}
.slot.needs{background:var(--review-bg)}
.slot .acts{display:flex;gap:4px}
.slot .acts button{font-family:inherit;font-size:12px;font-weight:600;padding:3px 9px;
  border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);cursor:pointer}
.slot .acts button:hover{border-color:var(--action);color:var(--action)}
@media(max-width:560px){.slot{grid-template-columns:1fr;gap:4px}}

.gate{padding:var(--s3) var(--s4);border-top:1px solid var(--border);background:var(--surface-2)}
.gate ul{list-style:none;margin:var(--s2) 0 0}
.gate li{font-size:13.5px;color:var(--text-2);padding:2px 0}
.gate li::before{content:"× ";color:var(--blocked);font-weight:700}

.composer{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--border)}
.composer input{flex:1;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-input);padding:10px var(--s3);font-family:inherit;font-size:14.5px;
  color:var(--text);outline:none}
.composer input:focus{border-color:var(--action);box-shadow:0 0 0 3px var(--action-bg)}
.composer button{min-width:44px;justify-content:center}

/* ═══ view switcher (prototype chrome only — not part of the product) ═══ */
.switcher{
  position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--surface);
  border-top:2px solid var(--action);padding:var(--s2) var(--s4);
  display:flex;gap:var(--s2);align-items:center;overflow-x:auto;
}
.switcher b{font-size:11.5px;color:var(--text-2);white-space:nowrap;margin-right:var(--s2);
  font-weight:600}
.switcher button{
  font-family:inherit;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;
  background:transparent;border:1px solid var(--border);border-radius:var(--r-pill);
  color:var(--text-2);white-space:nowrap;
}
.switcher button[aria-pressed=true]{background:var(--action);border-color:var(--action);color:#fff}
body{padding-bottom:56px}
.field{padding-bottom:150px}

.hide{display:none}
@media(prefers-reduced-motion:no-preference){
  main>*,.field>*{animation:rise .2s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div id="app"></div>

<div class="switcher" role="group" aria-label="Reference template">
  <b>Reference templates</b>

/* ═══════════════════════════════════════════════════════════════
   STATUS SYSTEM — the one vocabulary every screen shares.
   Internal enums are translated here and nowhere else, so a state
   can never read one way on Dispatch and another on Documents.
   ═══════════════════════════════════════════════════════════════ */
const STATUS = {
  ready:   {icon:"✓", word:"Ready"},
  review:  {icon:"!", word:"Review"},
  blocked: {icon:"×", word:"Blocked"},
  unknown: {icon:"?", word:"Unknown"},
  pending: {icon:"○", word:"Pending"},
  syncing: {icon:"↻", word:"Syncing"},
};

/** Internal enum → the words a person reads. Technical name stays in evidence. */
const HUMAN = {
  eligible:            ["ready",   "Ready"],
  eligible_review:     ["review",  "Needs review"],
  blocked:             ["blocked", "Blocked"],
  unknown:             ["unknown", "Not established"],
  partially_staffed:   ["review",  "Crew incomplete"],
  staffed:             ["ready",   "Crew complete"],
  dependency_change:   ["review",  "Something changed since the last safety check"],
  at_risk:             ["review",  "At risk"],
  released:            ["ready",   "Cleared to depart"],
};

const st = (kind, label, size) => {
  const s = STATUS[kind];
  return `<span class="st ${kind}${size ? " " + size : ""}"><i>${s.icon}</i>${label ?? s.word}</span>`;
};
const human = (enumKey) => { const [k,l] = HUMAN[enumKey] ?? ["unknown", enumKey]; return st(k,l); };

/* ── navigation: nine domains, role-filtered ── */
const NAV = {
  dispatch: [["Home","⌂"],["Jobs","▤"],["Dispatch","◈",4],["Fleet","▣"],["People","◉"],

const sideNav = (items, active) => `

/* ── boot ── */
let view = "tokens";
const render = () => { document.getElementById("app").innerHTML = V[view](); window.scrollTo(0,0); };

document.querySelectorAll(".switcher button[data-v]").forEach(b=>{
  b.onclick = () => {
    view = b.dataset.v;
    document.querySelectorAll(".switcher button[data-v]")
      .forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    // Field defaults to dark, everything else to light — the modes are a
    // working choice, not decoration.
    document.documentElement.dataset.theme = view === "driver" ? "dark" : "light";
    document.getElementById("theme").textContent =
      document.documentElement.dataset.theme === "dark" ? "Light" : "Dark";
    render();
  };
});
document.getElementById("theme").onclick = (e) => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  e.target.textContent = next === "dark" ? "Light" : "Dark";
};
render();
</script>
