name: CI

on: [push, pull_request]

# B23.1B — least privilege. The gate reads the repository, runs a throwaway
# database and builds; it writes nothing back to GitHub, so it does not need the
# default token's write scopes. Nothing here reads `secrets.*`: the database is
# a service container with an empty root password that exists for the length of
# one job, and no production or deployment credential is available to it.
permissions:
  contents: read

# One run per ref. A push that supersedes another cancels it rather than leaving
# two full gates racing for runners; the in-progress run for the DEFAULT branch
# is never cancelled, because its result is the record of whether main is green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # The required status check is `CI / test`. Renaming this job renames that
  # check, so branch protection has to be updated in the same change.
  test:
    runs-on: ubuntu-latest

    # Disposable database. Everything below now runs — including the 15 DB
    # tests and the award concurrency suite, neither of which could execute
    # before this existed.
    #
    # MariaDB, not MySQL. This service used to be mysql:8.0, under which the
    # migration step could never have succeeded: 0021_active_role_uniqueness.sql
    # declares a generated column with the PERSISTENT keyword, which is MariaDB's
    # spelling — MySQL 8.0 accepts only VIRTUAL and STORED and rejects the
    # statement outright. server/reservedWordColumns.test.ts points the same way:
    # it derives its reserved set from the live server and pins the answer
    # MariaDB 10.11 gives. 10.11 is the version the reconciliation gate was
    # verified against.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: leaseos
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    # root, not a scoped user: scripts/ci-gate.sh starts from an empty database
    # by issuing DROP DATABASE / CREATE DATABASE, which a scoped user cannot do.
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/leaseos

    steps:
      # Full history, not the default depth of 1. registerClaims.test.ts checks
      # every commit hash the register claims with `git cat-file -e`, which can
      # only see what was fetched.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # No `version` input: package.json pins packageManager (pnpm@10.4.1+sha512)
      # and pnpm/action-setup@v4 refuses to run when both are given.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      # ubuntu-latest (24.04) ships no `mysql` client; the gate scripts need one.
      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - run: pnpm install --frozen-lockfile

      # B23.1B — say plainly that the database is reachable before running a
      # seven-minute gate against it.
      #
      # The service's own health check already gates the job starting, so this
      # is not a wait and there is no sleep: it is the difference between "gate
      # 1 failed" and "the database never came up". Those want different first
      # questions, and the gate's later failures are only meaningful if this
      # passed. The version is printed because 0021 declares a PERSISTENT
      # generated column, which is MariaDB's spelling and which MySQL rejects —
      # so a silently swapped image is worth seeing at the top of the log.
      - name: Database reachable
        run: |
          if ! out=$(mysql -h 127.0.0.1 -P 3306 -u root -N -B -e "SELECT VERSION();" 2>&1); then
            echo "FAIL: the MariaDB service is not answering on 127.0.0.1:3306."
            echo "The gate needs a database; it will not fall back to running without one."
            echo "$out"
            exit 1
          fi
          echo "MariaDB $out"
          case "$out" in
            10.11*) ;;
            *) echo "WARNING: expected MariaDB 10.11, the version this gate is verified against." ;;
          esac

      # The whole gate, not a hand-rolled subset of it. The previous inline
      # steps skipped gates 0, 5, 7b, 7c and 8.
      - name: CI gate
        run: bash scripts/ci-gate.sh
