name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    # Disposable database. Everything below now runs — including the 15 DB
    # tests and the award concurrency suite, neither of which could execute
    # before this existed.
    #
    # MariaDB, not MySQL. This service used to be mysql:8.0, under which the
    # migration step could never have succeeded: 0021_active_role_uniqueness.sql
    # declares a generated column with the PERSISTENT keyword, which is
    # MariaDB's spelling — MySQL 8.0 accepts only VIRTUAL and STORED and
    # rejects the statement outright. server/reservedWordColumns.test.ts points
    # the same way: it derives its reserved set from the live server and pins
    # the answer MariaDB 10.11 gives. So the engine is not a preference here,
    # it is what the ledger and the suite were written against.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: leaseos
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    # root, not a scoped user: three suites migrate a database OF THEIR OWN
    # rather than sharing this one — migrationLedger, trackingOwnershipMigration
    # (which applies 0171 alone, to check what it attributes and what it leaves
    # unattributed) and recordsApiAuthorization (whose bootstrap test needs a
    # globally clean slate). A user scoped to one schema cannot CREATE DATABASE,
    # so all three would fail to start.
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/leaseos

    steps:
      # Full history, not the default depth of 1. registerClaims.test.ts checks
      # every commit hash the register claims with `git cat-file -e`, which can
      # only see what was fetched — so under a shallow clone every historical
      # claim reads as "a commit this branch does not contain", which is a
      # statement about the checkout rather than about the register.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # No `version` input: package.json pins packageManager (pnpm@10.4.1+sha512)
      # and pnpm/action-setup@v4 refuses to run when both are given, even when
      # they agree — which they did, at 10.4.1. Every run on this branch died
      # here, in 40 seconds, before a single test executed, so the whole branch
      # read red while the gate was green locally.
      #
      # Pinned to the v4 commit rather than the mutable `@v4` tag: a tag can be
      # moved to point at different code, so a third-party action referenced by
      # tag is code this workflow has not reviewed. Same implementation,
      # immutable reference — not an upgrade.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # ubuntu-latest (24.04) ships no `mysql` client, and apply-migrations.sh
      # drives one directly — it has to, because drizzle separates statements
      # with `--> statement-breakpoint` and compound trigger bodies need
      # DELIMITER, neither of which a driver will do for you.
      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      # Applying migrations IS a test. A migration that has never executed is
      # an assumption, not a schema.
      - name: Apply migrations
        run: bash scripts/apply-migrations.sh

      - name: Verify schema/migration parity
        run: bash scripts/verify-parity.sh

      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm build
