name: CI

on: [push, pull_request]

# The gate reads the repository and nothing else: no comment, no status, no package, no
# commit. Declaring that here means a compromised dependency or action in this workflow
# cannot use the job's token to write to the repository.
permissions:
  contents: read

# Cancel superseded runs of the same stream. `push` and `pull_request` are deliberately
# NOT collapsed into one group: a pull_request run tests the merge result while a push run
# tests the branch tip, so they are different questions and cancelling one for the other
# would discard an answer nobody else provides.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Disposable database. Everything below now runs — including the 15 DB
    # tests and the award concurrency suite, neither of which could execute
    # before this existed.
    #
    # MariaDB, not MySQL. This service used to be mysql:8.0, under which the
    # migration step could never have succeeded: 0021_active_role_uniqueness.sql
    # declares a generated column with the PERSISTENT keyword, which is MariaDB's
    # spelling — MySQL 8.0 accepts only VIRTUAL and STORED and rejects the
    # statement outright. server/reservedWordColumns.test.ts points the same way:
    # it derives its reserved set from the live server and pins the answer
    # MariaDB 10.11 gives. 10.11 is the version the reconciliation gate was
    # verified against.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          # Unique per run, per attempt, per job — the same name DATABASE_URL below
          # points at. See the note there for why a static name is unsafe.
          MARIADB_DATABASE: leaseos_${{ github.run_id }}_${{ github.run_attempt }}_${{ github.job }}
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    # root, not a scoped user: scripts/ci-gate.sh starts from an empty database
    # by issuing DROP DATABASE / CREATE DATABASE, which a scoped user cannot do.
    #
    # The name is unique per run, attempt and job because the gate DROPs and recreates
    # whatever DATABASE_URL names, plus a `<name>_widgets` companion it derives from it.
    # With a static name, two runs overlapping — a re-run started before the first
    # finished, or two branches building at once against one server — have the second
    # drop the first's schema mid-suite. That produces failures in suites the change never
    # touched, which read as unrelated product bugs; it cost a real misdiagnosis locally
    # before this was fixed.
    #
    # Worst-case length is 35 characters including the `_widgets` suffix, against
    # MariaDB's 64-character limit.
    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/leaseos_${{ github.run_id }}_${{ github.run_attempt }}_${{ github.job }}

    steps:
      # Full history, not the default depth of 1. registerClaims.test.ts checks
      # every commit hash the register claims with `git cat-file -e`, which can
      # only see what was fetched.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # No `version` input: package.json pins packageManager (pnpm@10.4.1+sha512)
      # and pnpm/action-setup@v4 refuses to run when both are given.
      #
      # Pinned to the v4 commit rather than the mutable `@v4` tag: a tag can be moved to
      # point at different code, so a third-party action referenced by tag is code this
      # workflow has not reviewed. Same implementation, immutable reference — not an
      # upgrade. actions/checkout and actions/setup-node stay on their current majors;
      # pinning those is separate work.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # The exact Node build comes from .nvmrc, not from a literal here. `node-version: 22`
      # floated across patch builds, and patch builds carry different ICU and tz data: on
      # 2026-10-01 the same commit answered two different instants for the Pacific date
      # 2026-11-08 — Node 22.23.2 (tz 2025c) on one runner image, 22.23.3 (tz 2026c, which
      # knows British Columbia no longer falls back) on the next. One file now states the
      # runtime for developers and CI alike, and scripts/check-version-truth.mjs refuses a
      # workflow that names a version any other way, and a CI runtime that is not that build.
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }

      # ubuntu-latest (24.04) ships no `mysql` client; the gate scripts need one.
      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - run: pnpm install --frozen-lockfile

      # The whole gate, not a hand-rolled subset of it. The previous inline
      # steps skipped gates 0, 5, 7b, 7c and 8.
      - name: CI gate
        run: bash scripts/ci-gate.sh
