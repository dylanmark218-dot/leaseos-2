<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaseOS — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bed:#0F151C; --panel:#161E27; --panel2:#1D2733; --line:#2A3745; --line-soft:#212C38;
  --ink:#E8EEF4; --dim:#93A7B9; --faint:#5F7488;
  --amber:#F0A22E; --amber-dim:#3A2E17;
  --verified:#4FB286; --verified-dim:#16302690;
  --blocked:#E2603F; --blocked-dim:#341B15;
  --sand:#C9B085;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bed); color:var(--ink);
  font-family:'Barlow',system-ui,sans-serif; font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.86em;letter-spacing:-.01em}
.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
@media(max-width:860px){.app{grid-template-columns:1fr}}

/* ---------- top bar ---------- */
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:18px;
  padding:0 18px;height:56px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50
}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.06em}
.brand span{color:var(--faint);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.roleswitch{margin-left:auto;display:flex;gap:2px;background:var(--bed);padding:3px;border:1px solid var(--line);border-radius:var(--r)}
.roleswitch button{
  background:none;border:0;color:var(--dim);font-family:inherit;font-size:12px;
  padding:5px 11px;cursor:pointer;border-radius:2px;letter-spacing:.04em;text-transform:uppercase
}
.roleswitch button[aria-pressed=true]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.roleswitch button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.netpill{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);letter-spacing:.05em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--verified)}
.dot.off{background:var(--amber)}
@media(max-width:860px){.netpill{display:none}}

/* ---------- nav ---------- */
nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 0 40px;overflow-y:auto}
.navgroup{margin-bottom:6px}
.navgroup h4{
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  padding:14px 18px 6px;font-weight:600
}
nav a{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 18px;color:var(--dim);text-decoration:none;font-size:14px;
  border-left:2px solid transparent;cursor:pointer
}
nav a:hover{color:var(--ink);background:var(--panel2)}
nav a.on{color:var(--ink);border-left-color:var(--amber);background:var(--panel2)}
nav a:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.count{font-family:'IBM Plex Mono';font-size:11px;background:var(--amber-dim);color:var(--amber);padding:1px 6px;border-radius:9px}
.count.zero{background:var(--panel);color:var(--faint)}
.navmob{display:none}
@media(max-width:860px){
  nav{display:none;position:fixed;inset:56px 0 0;z-index:40}
  nav.open{display:block}
  .navmob{display:block;background:none;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;padding:5px 9px;border-radius:var(--r);cursor:pointer}
}

/* ---------- main ---------- */
main{padding:22px 26px 90px;max-width:1180px}
@media(max-width:600px){main{padding:16px 14px 90px}}
.head{margin-bottom:20px}
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
h1{font-family:'Barlow Condensed';font-weight:700;font-size:30px;letter-spacing:.01em;line-height:1.1}
.sub{color:var(--dim);font-size:14px;margin-top:6px;max-width:70ch}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* ---------- SIGNATURE: provenance ---------- */
.prov{
  display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono';font-size:10px;
  padding:1px 6px;border-radius:2px;letter-spacing:.02em;white-space:nowrap;vertical-align:middle
}
.prov.confirmed{background:var(--verified-dim);color:var(--verified);box-shadow:inset 0 0 0 1px #4FB28640}
.prov.pending{background:var(--amber-dim);color:var(--amber);box-shadow:inset 0 0 0 1px #F0A22E40}
.prov.unknown{background:#232C36;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.prov.blockedp{background:var(--blocked-dim);color:var(--blocked);box-shadow:inset 0 0 0 1px #E2603F40}
/* unconfirmed values read differently everywhere */
.unconf{border-bottom:1.5px dashed var(--amber);color:var(--amber)}
.conf{border-bottom:1.5px solid #4FB28655}

/* hazard edge — the pending stack */
.hazard{border-left:3px solid transparent;
  border-image:repeating-linear-gradient(45deg,var(--amber) 0 6px,#0000 6px 12px) 1}

/* ---------- data rows ---------- */
.kv{display:grid;grid-template-columns:minmax(120px,34%) 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--faint);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.kv dd{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
.wrapx{overflow-x:auto}

/* ---------- buttons ---------- */
button.btn,a.btn{
  font-family:inherit;font-size:14px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);padding:9px 15px;border-radius:var(--r);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;gap:7px
}
button.btn:hover,a.btn:hover{border-color:var(--faint)}
button.btn:focus-visible,a.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.go{background:var(--amber);color:#20160A;border-color:var(--amber);font-weight:600}
.btn.ok{background:transparent;border-color:#4FB28666;color:var(--verified)}
.btn.no{background:transparent;border-color:#E2603F55;color:var(--blocked)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* driver one-tap */
.tap{
  width:100%;font-family:'Barlow Condensed';font-weight:700;font-size:23px;letter-spacing:.05em;
  padding:22px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r);cursor:pointer;text-align:left;display:flex;align-items:center;
  justify-content:space-between;gap:12px
}
.tap.next{background:var(--amber);color:#20160A;border-color:var(--amber)}
.tap.done{color:var(--faint);border-style:dashed}
.tap:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.tap small{font-family:'IBM Plex Mono';font-size:12px;font-weight:400;letter-spacing:0;opacity:.75}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:96px}
.tl::before{content:'';position:absolute;left:79px;top:6px;bottom:6px;width:1px;background:var(--line)}
.ev{position:relative;padding:7px 0}
.ev time{position:absolute;left:-96px;width:66px;text-align:right;font-family:'IBM Plex Mono';
  font-size:12.5px;color:var(--dim)}
.ev::before{content:'';position:absolute;left:-21px;top:14px;width:7px;height:7px;border-radius:50%;
  background:var(--verified);box-shadow:0 0 0 3px var(--panel)}
.ev.pend::before{background:var(--amber)}
.ev.gap::before{background:transparent;box-shadow:inset 0 0 0 1px var(--faint),0 0 0 3px var(--panel)}
.ev b{font-weight:600;font-size:14.5px}
.ev p{color:var(--dim);font-size:13px;margin-top:1px}
.gapnote{color:var(--sand);font-size:12.5px;font-family:'IBM Plex Mono'}

/* ---------- misc ---------- */
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.stat .n{font-family:'Barlow Condensed';font-weight:700;font-size:29px;line-height:1}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.stat.warn .n{color:var(--amber)} .stat.bad .n{color:var(--blocked)} .stat.good .n{color:var(--verified)}
.note{border-left:2px solid var(--line);padding:2px 0 2px 12px;color:var(--dim);font-size:13.5px}
.note.amber{border-left-color:var(--amber)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border:1px solid var(--line);border-radius:2px;color:var(--dim)}
.layer{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.layer:last-child{border-bottom:0}
.layer input{accent-color:var(--amber);width:15px;height:15px}
.maprect{background:
  repeating-linear-gradient(0deg,#1a2531 0 1px,#0000 1px 42px),
  repeating-linear-gradient(90deg,#1a2531 0 1px,#0000 1px 42px),var(--panel2);
  border:1px solid var(--line);border-radius:var(--r);height:290px;position:relative;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%);font-family:'IBM Plex Mono';font-size:11px;
  background:var(--bed);border:1px solid var(--amber);color:var(--amber);padding:2px 6px;border-radius:2px;white-space:nowrap}
.pin.v{border-color:var(--verified);color:var(--verified)}
.zone{position:absolute;transform:translate(-50%,-50%);border:1px dashed var(--verified);
  border-radius:50%;background:#4FB28610}
.say{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.say.driver{border-left:2px solid var(--sand)}
.say.ai{border-left:2px solid var(--amber)}
.say .who{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.hide{display:none}
.footnote{color:var(--faint);font-size:12.5px;margin-top:10px}
.scr{scroll-margin-top:70px}
@media(prefers-reduced-motion:no-preference){
  main>*{animation:in .22s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <button class="navmob" id="navtoggle" aria-label="Menu">☰</button>
    <div class="brand"><b>LEASEOS</b><span>FieldRoute</span></div>
    <div class="roleswitch" role="group" aria-label="Role">
      <button data-role="driver" aria-pressed="true">Driver</button>
      <button data-role="mechanic" aria-pressed="false">Shop</button>
      <button data-role="office" aria-pressed="false">Office</button>
      <button data-role="admin" aria-pressed="false">Admin</button>
    </div>
    <div class="netpill"><span class="dot off" id="netdot"></span><span id="nettext">Offline · 4 queued · synced 11m ago</span></div>
  </header>

  <nav id="nav"></nav>
  <main id="view"></main>
</div>

<script>
/* =========================================================================
   PROTOTYPE DATA
   Field names intentionally mirror drizzle/schema.ts so this file doubles
   as the UI-side contract reference when the backends get built.
   ========================================================================= */
const DB = {
  trip:{ tripNumber:"TRIP-2026-004821", tripType:"round_trip", status:"unloading",
    jobCode:"JOB-8841", customer:"Northridge Energy", unitNumber:"VAC-27", operator:"D. Reid",
    odometerStartKm:284291, odometerEndKm:null, distanceKm:null,
    originLocation:"04-12-084-06W5 · North Pad", destinationFacility:"Clearwater Disposal #3" },

  stops:[
    {stopType:"load", seq:1, arrivedAt:"07:34", setupStartedAt:"07:41", operationStartedAt:"07:48",
     operationCompletedAt:"08:16", departedAt:"08:21", waitMinutes:7, setupMinutes:7,
     durationMinutes:47, quantity:8000, quantityUnit:"L", ticketNumber:"LD-77219",
     delayReason:"Loading equipment unavailable", src:"confirmed"},
    {stopType:"unload", seq:2, arrivedAt:"10:03", setupStartedAt:"10:11", operationStartedAt:"10:14",
     operationCompletedAt:"10:37", departedAt:null, waitMinutes:8, setupMinutes:3,
     durationMinutes:null, quantity:null, quantityUnit:"L", ticketNumber:null,
     delayReason:"Scale delay", src:"pending"}
  ],

  pending:[
    {id:"ZE-3391", kind:"zone", eventType:"exit", zone:"Clearwater Disposal #3 · Unload Zone",
     detectedAt:"10:42:07", distanceMetres:96, accuracyMetres:11, confidence:"high",
     asks:"Set departure at 10:42 for the unload stop?"},
    {id:"ZE-3390", kind:"zone", eventType:"enter", zone:"North Pad · Loading Zone 14",
     detectedAt:"07:33:51", distanceMetres:61, accuracyMetres:38, confidence:"low",
     asks:"GPS accuracy was 38 m near the boundary. Did you arrive at 07:34?"},
    {id:"AI-8812", kind:"ai", field:"Load quantity", value:"8,000 L", precision:"approximate",
     source:"driver_voice", confidence:"medium",
     asks:"You said “about 8,000 litres.” Was that metered or estimated?"},
    {id:"OCR-441", kind:"ocr", field:"Disposal ticket", value:"Net 8,500 kg · DSP-99183",
     source:"photo_ocr", confidence:"medium",
     asks:"Attach this scale ticket to TRIP-2026-004821?"}
  ],

  exceptions:[
    {n:3, label:"Missing documents", sev:"warn", detail:"Trips 4818, 4820, 4821 — disposal ticket"},
    {n:2, label:"Expiring licences", sev:"warn", detail:"D. Reid (18d), M. Okonkwo (26d)"},
    {n:1, label:"Insurance expiring", sev:"bad", detail:"Unit TRK-31 — 6 days"},
    {n:4, label:"Trips missing tickets", sev:"warn", detail:"Oldest 9 days"},
    {n:1, label:"Unit due inspection", sev:"bad", detail:"VAC-12 — overdue 3 days"},
    {n:2, label:"Excessive load time", sev:"warn", detail:"Facility A · +31 min vs baseline"},
    {n:6, label:"Unconfirmed GPS events", sev:"warn", detail:"Across 3 active trips"},
    {n:3, label:"Incomplete logbooks", sev:"warn", detail:"Yesterday's shift"}
  ],

  jobs:[
    {jobCode:"JOB-8841", customer:"Northridge Energy", type:"Vacuum haul", mode:"general",
     location:"04-12-084-06W5", driver:"D. Reid", vehicle:"VAC-27", status:"in_transit", progress:72},
    {jobCode:"JOB-8842", customer:"Northridge Energy", type:"Water delivery", mode:"transport",
     location:"11-04-081-11W5", driver:"M. Okonkwo", vehicle:"WTR-08", status:"loading", progress:34},
    {jobCode:"JOB-8843", customer:"Bearpaw Resources", type:"Hydrovac", mode:"hydrovac",
     location:"07-22-079-05W5", driver:"—", vehicle:"—", status:"dispatched", progress:0},
    {jobCode:"JOB-8839", customer:"Cold Lake Field Svc", type:"Recovery", mode:"recovery",
     location:"02-18-086-09W5", driver:"J. Whitecalf", vehicle:"TRK-31", status:"awaiting_docs", progress:95}
  ],

  audit:[
    {t:"11:15", who:"Office · S. Bell", what:"Corrected unload quantity",
     was:"8.2 m³", now:"8.7 m³", why:"Corrected from scale ticket DSP-99183"},
    {t:"11:12", who:"System", what:"Generated manifest M-28491", was:"—", now:"draft", why:"Trip stops complete"},
    {t:"11:04", who:"Office · S. Bell", what:"Attached disposal ticket", was:"—", now:"DSP-99183", why:"Driver upload"},
    {t:"10:37", who:"Driver · D. Reid", what:"Marked unloading complete", was:"in_progress", now:"complete", why:"—"},
    {t:"08:42", who:"System", what:"Proposed zone enter (rejected)", was:"pending", now:"rejected",
     why:"Driver: wrong lease, GPS drift"}
  ],

  defects:[
    {id:"MD-4821", unit:"VAC-27", title:"Pump grinding on start-up", severity:"inspection_required",
     status:"open", reportedAt:"12:31", by:"Driver voice report", blocks:false},
    {id:"MD-4809", unit:"TRK-31", title:"Brake pull to right", severity:"critical",
     status:"in_progress", reportedAt:"Aug 27", by:"Post-trip DVIR", blocks:true},
    {id:"MD-4804", unit:"WTR-08", title:"Marker light out — driver side", severity:"advisory",
     status:"open", reportedAt:"Aug 26", by:"Pre-trip", blocks:false}
  ],

  feedback:[
    {id:184, area:"Trip logging", who:"Driver", problem:"Have to enter odometer twice",
     freq:"Daily", impact:"High", status:"Under review"},
    {id:183, area:"Disposal tickets", who:"Driver", problem:"Camera closes before I confirm",
     freq:"Several/week", impact:"High", status:"Fix planned"},
    {id:181, area:"Billing", who:"Office", problem:"Wait time not separated from load time",
     freq:"Weekly", impact:"Medium", status:"Under review"}
  ]
};

/* ---------- nav definition (role-scoped) ---------- */
const NAV = [
  {group:"Field", roles:["driver","office","admin"], items:[
    ["job","Current job",null],["timeline","Trip timeline",null],
    ["confirm","Confirmations","4"],["secretary","AI Secretary",null],
    ["fieldticket","Field ticket & sign-off","1"],
    ["map","Field map",null],["report","Report a condition",null],["pretrip","Pre-trip",null],
    ["dailylog","Daily log",null]]},
  {group:"Shop", roles:["mechanic","office","admin"], items:[
    ["unit","Unit passport",null],["defects","Defects","3"],["workorders","Work orders",null]]},
  {group:"Dispatch", roles:["office","admin"], items:[
    ["dispatchboard","Dispatch board","4"],["bids","Invitations & bids","7"],
    ["oncall","On call",null],["schedule","7-day schedule","1"]]},
  {group:"Office", roles:["office","admin"], items:[
    ["exceptions","Exception centre","22"],["search","Tracking search",null],
    ["jobs","Jobs",null],["classify","Job classification",null],["trips","Trips",null],["billingbook","Billing book",null],["reconcile","Ticket reconciliation","1"],["disposalrecon","Disposal reconciliation","1"],
    ["invoice","Invoices & acceptance","2"],
    ["docs","Documents & expiry","3"],["disposal","Disposal directory",null],
    ["billing","Rate cards",null],["audit","Audit log",null],["feedback","Feedback queue","3"]]},
  {group:"Admin", roles:["admin"], items:[
    ["numbering","Numbering & sequences",null],["customercfg","Customer billing config",null],["zones","Operating zones",null],
    ["roles","Roles & permissions",null],["sync","Sync & offline",null]]}
];

let role="driver", screen="job";

/* ---------- render helpers ---------- */
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const provChip=(kind,text)=>`<span class="prov ${kind}">${text}</span>`;

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  NAV.filter(g=>g.roles.includes(role)).forEach(g=>{
    const box=el(`<div class="navgroup"><h4>${g.group}</h4></div>`);
    g.items.forEach(([id,label,count])=>{
      const a=el(`<a href="#${id}" ${screen===id?'class="on"':''}>${label}
        ${count?`<span class="count">${count}</span>`:''}</a>`);
      a.onclick=e=>{e.preventDefault();go(id)};
      box.appendChild(a);
    });
    nav.appendChild(box);
  });
}
function go(id){screen=id;renderNav();renderView();document.getElementById('nav').classList.remove('open');window.scrollTo(0,0)}

/* =========================== SCREENS =========================== */
const S={};

S.job=()=>{
  const t=DB.trip;
  return `
  <div class="head"><div class="eyebrow">Active assignment</div>
    <h1>${t.tripNumber}</h1>
    <p class="sub">${t.customer} · ${t.jobCode} · Unit ${t.unitNumber}</p></div>

  <div class="card">
    <h3>Unload — Clearwater Disposal #3</h3>
    <div class="grid" style="gap:9px">
      <button class="tap done">Arrived <small>10:03 · confirmed</small></button>
      <button class="tap done">Setup started <small>10:11 · confirmed</small></button>
      <button class="tap done">Unloading started <small>10:14 · confirmed</small></button>
      <button class="tap done">Empty <small>10:37 · confirmed</small></button>
      <button class="tap next" onclick="go('confirm')">Depart <small>GPS says 10:42 — needs your OK</small> →</button>
    </div>
    <p class="footnote">Every tap writes one event. Times, distance, wait reasons, logbook lines
      and billing all read from these — you never enter them twice.</p>
  </div>

  <div class="grid g2">
    <div class="card"><h3>This stop</h3>
      <dl class="kv">
        <dt>Arrived</dt><dd class="mono conf">10:03</dd>
        <dt>Wait</dt><dd>8 min — <span class="tag">Scale delay</span></dd>
        <dt>Setup</dt><dd>3 min</dd>
        <dt>Unloading</dt><dd>23 min</dd>
        <dt>Departed</dt><dd class="mono unconf">10:42 ${provChip('pending','GPS · UNCONFIRMED')}</dd>
        <dt>Ticket</dt><dd class="mono unconf">DSP-99183 ${provChip('pending','OCR · REVIEW')}</dd>
      </dl></div>
    <div class="card"><h3>Still needed</h3>
      <div class="grid" style="gap:8px">
        <div class="note amber">Disposal ticket photo — office flagged this on trip 4818 too</div>
        <div class="note">Closing odometer at yard</div>
        <div class="note">Post-trip inspection</div>
      </div>
      <div class="btnrow" style="margin-top:12px">
        <button class="btn go" onclick="go('secretary')">Tell the secretary</button>
        <button class="btn" onclick="go('report')">Report a problem</button>
      </div></div>
  </div>`;
};

S.timeline=()=>`
  <div class="head"><div class="eyebrow">${DB.trip.tripNumber}</div><h1>Trip timeline</h1>
  <p class="sub">Built from confirmed events. Gaps are shown as gaps — the system never fills
    them in with a guess.</p></div>
  <div class="card"><div class="tl">

S.confirm=()=>{
  const rows=DB.pending.map(p=>{
    const conf = p.confidence==='low' ? 'blockedp' : p.confidence==='high' ? 'confirmed' : 'pending';
    const head = p.kind==='zone'
      ? `Geofence ${p.eventType} — ${p.zone}`
      : p.kind==='ai' ? `Voice value — ${p.field}` : `Photo read — ${p.field}`;
    const meta = p.kind==='zone'
      ? `<dt>Detected</dt><dd class="mono">${p.detectedAt}</dd>
         <dt>Distance</dt><dd class="mono">${p.distanceMetres} m from zone edge</dd>
         <dt>GPS accuracy</dt><dd class="mono">±${p.accuracyMetres} m</dd>`
      : `<dt>Value read</dt><dd class="mono unconf">${p.value}</dd>
         <dt>Source</dt><dd class="mono">${p.source}</dd>
         ${p.precision?`<dt>Precision</dt><dd>${p.precision}</dd>`:''}`;
    return `<div class="card hazard"><h3>${p.id} — ${head}</h3>
      <p style="margin-bottom:11px">${p.asks}</p>
      <dl class="kv" style="margin-bottom:13px">${meta}
        <dt>Confidence</dt><dd>${provChip(conf,p.confidence.toUpperCase())}</dd></dl>
      <div class="btnrow">
        <button class="btn ok" onclick="this.closest('.card').style.opacity=.35;this.closest('.btnrow').innerHTML='<span class=&quot;prov confirmed&quot;>CONFIRMED — WRITTEN TO TRIP</span>'">Yes, that's right</button>
        <button class="btn no" onclick="this.closest('.card').style.opacity=.35;this.closest('.btnrow').innerHTML='<span class=&quot;prov unknown&quot;>REJECTED — TRIP UNCHANGED</span>'">No</button>
        <button class="btn sm">Fix the value</button>
      </div></div>`;
  }).join('');
  return `<div class="head"><div class="eyebrow">Nothing below has been saved yet</div>
    <h1>Confirmations</h1>
    <p class="sub">GPS, voice and photo reading all propose — they never write. Until you answer,
      the trip record keeps its existing values and the field stays amber everywhere it appears.</p></div>
    ${rows}
    <p class="footnote">Rejecting leaves the record exactly as it was. Both answers are stored with
      your name and the time, so the office can see why a proposal was turned down.</p>`;
};

S.numbering=()=>`
  <div class="head"><div class="eyebrow">Admin</div><h1>Numbering & sequences</h1>
  <p class="sub">Format is configuration. The database uses its own internal IDs, so changing how
    numbers look never touches a single relationship.</p></div>
  <div class="card"><div class="wrapx"><table>
    <tr><th>Record</th><th>Format</th><th>Example</th><th>Resets</th><th>Next</th></tr>
    <tr><td>Job</td><td class="mono">JOB-{YYYY}-{000000}</td><td class="mono">JOB-2026-001842</td>
      <td>Yearly</td><td class="mono">1843</td></tr>
    <tr><td>Billing book</td><td class="mono">BB-{YYYY}-{000000}</td><td class="mono">BB-2026-001842</td>
      <td>Yearly</td><td class="mono">1843</td></tr>
    <tr><td>Trip</td><td class="mono">TR-{YYYY}-{000000}</td><td class="mono">TR-2026-004821</td>
      <td>Yearly</td><td class="mono">4824</td></tr>
    <tr><td>Load</td><td class="mono">LD-{trip}-{00}</td><td class="mono">LD-2026-004821-01</td>
      <td>Per trip</td><td class="mono">—</td></tr>
    <tr><td>Disposal ticket</td><td class="mono">DT-{trip}-{00}</td><td class="mono">DT-2026-004821-01</td>
      <td>Per trip</td><td class="mono">—</td></tr>
    <tr><td>Field ticket</td><td class="mono">FT-{YYYY}-{000000}</td><td class="mono">FT-2026-001842</td>
      <td>Yearly</td><td class="mono">1843</td></tr>
    <tr><td>Daily log</td><td class="mono">DL-{YYYY}-{MM}-{0000}</td><td class="mono">DL-2026-08-0047</td>
      <td>Monthly</td><td class="mono">0065</td></tr>
    <tr><td>Invoice</td><td class="mono">INV-{YYYY}-{000000}</td><td class="mono">INV-2026-000391</td>
      <td>Yearly</td><td class="mono">392</td></tr>
  </table></div></div>
  <div class="card"><h3>If you open a second yard</h3>
    <p class="sub" style="margin-top:0">Add a branch code and the same sequences keep running,
      separately, without a migration:</p>
    <div class="mono" style="color:var(--dim);line-height:2">CAL-JOB-2026-000182<br>
      EDM-JOB-2026-000391<br>JAS-JOB-2026-000047</div>

      LD-2026-004821-03, not the 903rd load of the year. Readable on a paper ticket.</p></div>`;

S.fieldticket=()=>`
  <div class="head"><div class="eyebrow">A billable service event — not a job, not a trip</div>
    <h1>Field ticket FT-2026-000421</h1>
    <p class="sub">Signed by the customer's representative before you leave. Unsigned work is the
      single most common reason a charge gets argued about ninety days later.</p></div>

  <div class="card"><h3>Scope — what this one ticket covers</h3>
    <div class="grid g4">
      <button class="btn">Whole job</button>
      <button class="btn go">This site visit</button>
      <button class="btn">One load</button>
      <button class="btn">Service event</button></div>
    <p class="footnote" style="margin-top:11px">Set to <b>site visit</b>: the rep signs once for
      07:18–09:14 covering all five loads. A different customer can sign per load instead — same
      table, no schema change. Two visits to the same site on the same day get two tickets, so one
      signature is never used to prove something that happened hours later.</p>
    <dl class="kv" style="margin-top:12px">
      <dt>Job</dt><dd class="mono">JOB-2026-001842</dd>
      <dt>Trip</dt><dd class="mono">TR-2026-004821</dd>
      <dt>Loads covered</dt><dd class="mono">LD-…-01 through LD-…-05</dd>
      <dt>Site</dt><dd>North Pad · 04-12-084-06W5</dd>
      <dt>Window</dt><dd class="mono">07:18 – 09:14</dd>
    </dl></div>

  <div class="card"><h3>Service timeline</h3>
    <div class="tl" style="padding-left:96px">
      <div class="ev"><time>07:18</time><b>Arrival</b></div>
      <div class="ev"><time>07:23</time><b>Setup</b></div>
      <div class="ev"><time>07:41</time><b>Loading</b></div>
      <div class="ev"><time>08:22</time><b>Loading complete</b><p>5 loads</p></div>
      <div class="ev pend"><time>08:25</time><b>Standby begins</b><p>Authorised on site by R. Hollis</p></div>
      <div class="ev pend"><time>09:10</time><b>Standby ends</b><p>45 min ${provChip('pending','DRIVER VOICE')}</p></div>
      <div class="ev"><time>09:14</time><b>Departure</b></div>
    </div></div>

  <div class="card hazard"><h3>Line by line — he accepted most of it</h3>
    <div class="wrapx"><table>
      <tr><th>Line</th><th>Qty</th><th>Measured</th><th>Rep's answer</th></tr>
      <tr><td>Vac truck — on site</td><td class="mono">3.0 h</td><td>System timed</td>
        <td>${provChip('confirmed','ACCEPTED')}</td></tr>
      <tr><td>Loads — 5 × liquid</td><td class="mono">42.1 m³</td><td>Scale</td>
        <td>${provChip('confirmed','ACCEPTED')}</td></tr>
      <tr><td>Disposal</td><td class="mono">42.1 m³</td><td>Scale</td>
        <td>${provChip('confirmed','ACCEPTED')}</td></tr>
      <tr><td>Extra hose — 200 ft</td><td class="mono">1</td><td>Driver</td>
        <td>${provChip('confirmed','ACCEPTED')}</td></tr>
      <tr><td>Standby</td><td class="mono unconf">45 min</td><td class="unconf">Driver voice</td>
        <td>${provChip('blockedp','DISPUTED')}</td></tr>
    </table></div>
    <div class="note amber" style="margin-top:12px">
      <b>Standby — both statements kept.</b><br>
      Driver: 45 minutes, 08:25–09:10.<br>
      Company rep: 20 minutes.<br>
      Neither figure is erased. The disputed line goes to billing review; the other four bill now.</div>
    <p class="footnote">If the whole ticket failed on one disagreement, drivers would stop asking
      for signatures at all.</p></div>

  <div class="card"><h3>Signature — what he actually agreed to</h3>
    <dl class="kv">
      <dt>Result</dt><dd>${provChip('pending','PARTIALLY ACCEPTED')}</dd>
      <dt>Signer</dt><dd>R. Hollis · Northridge Energy · Company representative</dd>
      <dt>Phone</dt><dd class="mono">403-555-0148</dd>
      <dt>Captured</dt><dd class="mono">09:15 · 51.0631, -114.0912 ${provChip('confirmed','GPS ±6 m')}</dd>
      <dt>Method</dt><dd>Drawn on driver's device</dd>
      <dt>Connection</dt><dd>${provChip('pending','SIGNED OFFLINE · QUEUED')}</dd>
      <dt>AFE</dt><dd class="mono unconf">AFE-8841-22 ${provChip('pending','SPOKEN BY REP')}</dd>
    </dl>
    <div class="note" style="margin-top:12px">
      <span class="mono" style="font-size:12.5px;color:var(--ink)">R. Hollis (Northridge Energy)
      accepted field ticket FT-2026-000421 for service at North Pad from 07:18 to 09:14, covering
      3 h vac truck service; 42.1 m³ loads; 42.1 m³ disposal; 200 ft extra hose — standby
      disputed.</span></div>
    <p class="footnote">That sentence is stored with the signature. “R. Hollis signed” on its own
      proves very little six weeks later.</p>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn go">Capture signature</button>
      <button class="btn no">Refused everything</button>
      <button class="btn">No representative on site</button></div></div>

  <div class="card"><h3>After signing</h3>
    <p class="sub" style="margin-top:0">The ticket is hashed at signature. Edit a quantity
      afterwards and the signed version stays intact while the job flags
      <span class="unconf">amended after signature</span> — nobody unknowingly invoices something
      different from what the rep agreed to.</p>
    <p class="sub">The ticket records facts, not money. “45 minutes standby” is evidence; the rate
      engine decides separately whether that becomes 45 × the standby rate. Accounting logic stays
      out of field evidence.</p></div>`;

S.classify=()=>`

    <h1>Job classification</h1>
    <p class="sub">Pick the work once. The routing profile, permits, tickets, PPE, inspection items
      and billing units all derive from it — nobody re-enters any of them.</p></div>

  <div class="card"><h3>Classify</h3>
    <div class="grid g2">
      <div><dl class="kv">
        <dt>Service</dt><dd>Oilfield — vacuum haul</dd>
        <dt>Truck</dt><dd>Tri-drive vacuum truck</dd>
        <dt>Trailer</dt><dd>None</dd>
        <dt>Cargo</dt><dd>Produced water · 16,000 kg</dd>
      </dl></div>
      <div><dl class="kv">
        <dt>Environment</dt><dd>Oilfield lease · gravel</dd>
        <dt>Radius</dt><dd>Regional</dd>
        <dt>Load method</dt><dd>Vacuum</dd>
        <dt>Unload method</dt><dd>Pump</dd>
      </dl></div></div>
    <p class="footnote">Twelve independent dimensions, not one giant dropdown — so
      “Class 1 / Super-B / oilfield pipe / oversize / TDG / permit-required” is a valid combination
      without anyone having hard-coded it.</p></div>

  <div class="card"><h3>→ Routing profile <span class="tag">for the map engine</span></h3>
    <div class="wrapx"><table>
      <tr><th>Axle group</th><th>Axles</th><th>Modelled load</th><th>Rating</th><th></th></tr>
      <tr><td>Steer</td><td class="mono">1</td><td class="mono">4,900 kg</td><td class="mono">8,200</td>
        <td>${provChip('confirmed','WITHIN')}</td></tr>
      <tr><td>Drive</td><td class="mono">3</td><td class="mono">28,600 kg</td><td class="mono">24,000</td>
        <td>${provChip('blockedp','OVER RATING')}</td></tr>
    </table></div>
    <dl class="kv" style="margin-top:12px">
      <dt>GVW</dt><dd class="mono">33,500 kg</dd>
      <dt>Envelope</dt><dd class="mono">11.6 m × 2.59 m × 4.05 m</dd>
      <dt>Oversize</dt><dd>${provChip('confirmed','NO')}</dd>
      <dt>Permit</dt><dd>${provChip('confirmed','NOT TRIGGERED')}</dd>
    </dl>
    <p style="margin:13px 0 7px;font-size:13px;color:var(--dim)">Layers the router must evaluate:</p>
    <div>${["gross_weight","axle_weight","bridge_weight","bridge_clearance","truck_route",
      "gravel_surface","seasonal_road_ban","lease_access","turnaround_capability"]
      .map(l=>`<span class="tag mono" style="margin:0 5px 5px 0">${l}</span>`).join('')}</div>
    <div class="note amber" style="margin-top:12px">Dangerous-goods layer <b>not</b> added —
      produced water isn't classified hazardous here. Swap the cargo to crude and the layer appears
      automatically, along with placarding on the inspection and TDG on the licence.</div></div>

  <div class="card"><h3>→ Everything else, derived</h3>
    <div class="grid g2">
      <div><dl class="kv">
        <dt>Licence</dt><dd>Class 3 / D <span class="tag">no trailer</span></dd>
        <dt>Endorsements</dt><dd>Air brake (Z)</dd>
        <dt>Tickets</dt><dd>H2S Alive · First Aid · Ground Disturbance · Site orientation</dd>
        <dt>PPE</dt><dd>Hard hat · glasses · boots · hi-vis · FR coveralls · gas monitor</dd>
      </dl></div>
      <div><dl class="kv">
        <dt>Permits</dt><dd>${provChip('confirmed','NONE REQUIRED')}</dd>
        <dt>Documents</dt><dd>Trip inspection · daily log · field ticket</dd>
        <dt>Inspection adds</dt><dd>Pump / PTO · tank and valves · hoses and fittings</dd>
        <dt>Billing units</dt><dd>Per hour · per load · standby · wait time · fuel surcharge</dd>
      </dl></div></div>
    <div class="note amber" style="margin-top:12px">
      <b>Thresholds unverified.</b> Oversize triggers for this jurisdiction are placeholders and
      must be confirmed with the issuing authority before dispatch relies on them. The engine says
      so rather than treating a default as law.</div></div>`;

S.bids=()=>`

    decides.</p></div>
  <div class="card"><div class="wrapx"><table>
    <tr><th>Operator</th><th>Unit</th><th>Distance</th><th>Departs</th><th>HOS</th><th>Match</th><th>Eligibility</th></tr>
    <tr><td>D. Reid</td><td class="mono">VAC-27</td><td class="mono">28 km</td><td class="mono">06:10</td>
      <td class="mono">600 min</td><td class="mono">86</td>
      <td>${provChip('pending','REVIEW')}</td></tr>
    <tr><td>M. Okonkwo</td><td class="mono">VAC-12</td><td class="mono">64 km</td><td class="mono">06:00</td>
      <td class="mono">480 min</td><td class="mono">74</td>
      <td>${provChip('blockedp','BLOCKED')}</td></tr>
    <tr><td>J. Whitecalf</td><td class="mono">VAC-31</td><td class="mono">112 km</td><td class="mono">07:15</td>
      <td class="mono unconf">not reported</td><td class="mono">61</td>
      <td>${provChip('unknown','UNKNOWN')}</td></tr>
    <tr><td>T. Lavallee</td><td class="mono">VAC-19</td><td class="mono">31 km</td><td class="mono">06:20</td>
      <td class="mono">540 min</td><td class="mono">83</td>
      <td>${provChip('confirmed','ELIGIBLE')}</td></tr>
  </table></div>
  <p class="footnote">Match and eligibility are separate columns because they answer different
    questions. D. Reid scores highest and is still not assignable.</p></div>

  <div class="card"><h3>Why T. Lavallee is suggested</h3>
    <div class="note">Suggested because TDG certification (current), H2S Alive (current),
      Specialty pool (vacuum_fluid), Equipment class (tri_drive_vac), Tank capacity (16,000 L),
      Pump (fitted), Distance from origin (31 km). This is a suitability match only — dispatch
      eligibility is evaluated separately.</div>
    <p class="footnote">Every factor and its point contribution is stored. There is no hidden
      ranking to argue with.</p></div>

  <div class="card"><h3>Why M. Okonkwo is blocked</h3>
    <dl class="kv">
      <dt>Blocker</dt><dd>${provChip('blockedp','VAC-12 ANNUAL INSPECTION EXPIRED 2026-08-26')}</dd>
      <dt>Overridable</dt><dd>${provChip('blockedp','NO — NOT BY ANY ROLE')}</dd>
    </dl>
    <div class="note amber" style="margin-top:11px">An expired inspection isn't a judgement call a
      manager gets to make. The condition has to be fixed. An attempted override would still be
      recorded — a refused attempt is exactly what an auditor wants to see.</div></div>

  <div class="card"><h3>Why J. Whitecalf is unknown</h3>
    <div class="note amber">Hours-of-service state not reported. Unknown ranks above review here:
      an unevaluated condition is not a known-minor one, and it can't resolve to eligible by
      default.</div></div>

  <div class="card"><h3>Before awarding</h3>
    <dl class="kv">
      <dt>Bid submitted</dt><dd class="mono">3 h 12 m ago</dd>
      <dt>Gate last run</dt><dd class="mono unconf">3 h 12 m ago</dd>
      <dt>Action</dt><dd>${provChip('pending','RE-RUN READINESS BEFORE AWARD')}</dd>
    </dl>
    <p class="footnote">A licence can expire at midnight between bid and award. The gate is re-run
      at assignment, never trusted from bid time.</p>
    <div class="btnrow" style="margin-top:11px"><button class="btn go">Re-run gate & award</button></div></div>`;

/* ---------- boot ---------- */
function renderView(){
  const v=document.getElementById('view');
  v.innerHTML=(S[screen]||S.job)();
}
document.querySelectorAll('.roleswitch button').forEach(b=>{
  b.onclick=()=>{
    role=b.dataset.role;
    document.querySelectorAll('.roleswitch button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const first=NAV.find(g=>g.roles.includes(role)).items[0][0];
    go(first);
  };
});
document.getElementById('navtoggle').onclick=()=>document.getElementById('nav').classList.toggle('open');
document.getElementById('netdot').parentElement.onclick=()=>{
  const d=document.getElementById('netdot'),t=document.getElementById('nettext');
  const off=d.classList.toggle('off');
  t.textContent=off?'Offline · 4 queued · synced 11m ago':'Online · all synced';
};
renderNav();renderView();
</script>
